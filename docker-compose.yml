services:
  guardian-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guardian-integration-gateway
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOW_FAILURE_SIMULATION: ${ALLOW_FAILURE_SIMULATION:-true}
      # Override ENCRYPTION_KEY in .env for non-demo environments (enforced in production)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      AUDIT_LOG_PATH: /app/data/audit_log.jsonl
      MOCK_AI_DELAY_SECONDS: ${MOCK_AI_DELAY_SECONDS:-2.0}
      CB_FAILURE_THRESHOLD: ${CB_FAILURE_THRESHOLD:-3}
      CB_RECOVERY_TIMEOUT_SECONDS: ${CB_RECOVERY_TIMEOUT_SECONDS:-30.0}
    volumes:
      - guardian_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  guardian_data:
